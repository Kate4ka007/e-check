<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Deep navy background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#0d152b"/>
      <stop offset="0.55" stop-color="#091127"/>
      <stop offset="1" stop-color="#050b1c"/>
    </linearGradient>

    <!-- Very subtle green atmospheric glow -->
    <radialGradient id="halo" cx="50%" cy="18%" r="38%">
      <stop offset="0" stop-color="#00e676" stop-opacity=".11"/>
      <stop offset=".35" stop-color="#00c968" stop-opacity=".045"/>
      <stop offset="1" stop-color="#00c968" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft lower glow -->
    <radialGradient id="groundGlow" cx="52%" cy="100%" r="55%">
      <stop offset="0" stop-color="#00e676" stop-opacity=".09"/>
      <stop offset=".5" stop-color="#00c968" stop-opacity=".025"/>
      <stop offset="1" stop-color="#00c968" stop-opacity="0"/>
    </radialGradient>

    <!-- Dots -->
    <pattern id="dots" width="24" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.35" fill="#00e676"/>
    </pattern>

    <!-- Wave-shaped terrain masks -->
    <linearGradient id="terrainFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".22" stop-color="white" stop-opacity=".12"/>
      <stop offset=".52" stop-color="white" stop-opacity=".62"/>
      <stop offset="1" stop-color="white" stop-opacity="1"/>
    </linearGradient>

    <mask id="terrainMask">
      <path fill="url(#terrainFade)"
        d="M0 925
           C170 875 320 905 470 938
           C610 968 700 920 810 898
           C960 868 1080 875 1190 900
           C1300 925 1370 908 1440 885
           L1440 1024 L0 1024 Z"/>
    </mask>

    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1024" fill="url(#bg)"/>
  <rect width="1440" height="1024" fill="url(#halo)"/>
  <rect width="1440" height="1024" fill="url(#groundGlow)"/>

  <!-- Very subtle atmospheric light -->
  <ellipse cx="720" cy="920" rx="520" ry="150"
           fill="#00e676" opacity=".035" filter="url(#blur)"/>

  <!-- Dotted digital terrain -->
  <g mask="url(#terrainMask)">
    <rect y="850" width="1440" height="174" fill="url(#dots)" opacity=".72"/>
    <rect y="850" width="1440" height="174" fill="url(#groundGlow)" opacity=".8"/>
  </g>

  <!-- Flowing wave contours -->
  <g fill="none" stroke="#00e676" stroke-linecap="round">
    <path d="M-20 954 C170 895 315 930 470 965 C620 998 720 951 840 928 C1010 895 1135 905 1250 931 C1340 951 1390 945 1460 918"
          stroke-width="1.4" opacity=".30"/>
    <path d="M-20 975 C165 918 315 951 470 983 C620 1014 735 970 850 946 C1000 915 1135 921 1250 948 C1340 968 1395 962 1460 936"
          stroke-width="1.1" opacity=".22"/>
    <path d="M-20 997 C160 943 315 973 465 1001 C615 1029 735 991 855 968 C1000 940 1140 945 1255 969 C1345 988 1395 983 1460 958"
          stroke-width="1" opacity=".15"/>
  </g>

  <!-- A brighter ridge on the right -->
  <path d="M760 931 C900 891 1030 884 1140 900 C1240 914 1320 930 1450 905"
        fill="none" stroke="#00e676" stroke-width="2.2" opacity=".55" filter="url(#glow)"/>
  <path d="M760 931 C900 891 1030 884 1140 900 C1240 914 1320 930 1450 905"
        fill="none" stroke="#00e676" stroke-width="1" opacity=".65"/>

  <!-- Dark vignette -->
  <rect width="1440" height="1024" fill="none" stroke="#000" stroke-width="90" opacity=".08"/>
</svg>
