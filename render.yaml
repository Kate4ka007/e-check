# Blueprint: https://render.com/docs/blueprint-spec
#
# После подключения репозитория Render создаст Web Service из Dockerfile.
# Бесплатный план: API и worker в одном контейнере (отдельный Background Worker
# на Render free недоступен).
#
# Перед деплоем задай секреты в Dashboard или при создании Blueprint (sync: false).
# APP_URL — URL фронтенда на Vercel; обнови после первого деплоя web.

services:
  - type: web
    name: e-check-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL
        value: 30d
      - key: COOKIE_DOMAIN
        value: ''
      - key: COOKIE_SECURE
        value: 'true'
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'false'
      - key: EXTRACTOR_KIND
        value: vision
      - key: EXTRACTOR_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: EXTRACTOR_API_KEY
        sync: false
      - key: EXTRACTOR_MODELS
        value: dots-studio/dots-3-note-preview:free
      - key: EXTRACTOR_TIMEOUT_MS
        value: '120000'
      - key: EXTRACTOR_MAX_ATTEMPTS
        value: '3'
      - key: EXTRACTOR_DATA_COLLECTION
        value: allow
      - key: UPLOAD_MAX_BYTES
        value: '15728640'
      - key: UPLOAD_RATE_PER_HOUR
        value: '30'
      - key: REGISTRATION_ENABLED
        value: 'true'
      - key: LOG_LEVEL
        value: info
